<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="cVault">
  <!-- cVault mark: near-black tile, white c and neon V at matched cap height.
       Cap band y=22..46; the round c overshoots it by 0.6 top and bottom so it
       reads the same size as the V. -->
  <rect width="64" height="64" rx="14" fill="#0A0A0B"/>
  <!-- Lowercase c: open ring, 78deg aperture centred at 3 o'clock -->
  <circle
    cx="18.5"
    cy="32"
    r="9.6"
    fill="none"
    stroke="#FAFAFA"
    stroke-width="6"
    stroke-linecap="butt"
    stroke-dasharray="47.25 13.07"
    stroke-dashoffset="-6.53"
  />
  <!-- Capital V. The apex sits at y=37.89 because the mitred join extends a
       further 6.71 below it, landing the tip on the same baseline as the c. -->
  <path
    d="M37.1 20 L46.1 37.89 L55.1 20"
    fill="none"
    stroke="#C8FF3D"
    stroke-width="6"
    stroke-linejoin="miter"
    stroke-miterlimit="10"
    stroke-linecap="butt"
  />
</svg>
