[package]
name = "vault"
version = "1.1.0"
description = "c_vault v1.1.0 — On-chain multi-fund index vault (ETF-style) for Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build","anchor-spl/idl-build"]


[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.0", features = ["token_2022", "associated_token"] }
pyth-solana-receiver-sdk = "0.6.0"
spl-token-metadata-interface = "0.6.0"
spl-pod = "0.5.0"

